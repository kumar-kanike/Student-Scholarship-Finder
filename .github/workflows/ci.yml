name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend syntax
        working-directory: backend
        run: |
          npm install
          node --check server.js
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
